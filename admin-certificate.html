<!DOCTYPE html>
<html>

<head>

<title>Admin Certificate Generator - Anjali Bike Driving School</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<section class="admin-panel">


<div class="admin-box">


<h1>
🏆 Admin Certificate Generator
</h1>


<p>
Generate student training certificates
</p>


<input 
type="text"
id="inputName"
placeholder="Student Name">


<select id="inputCourse">

<option value="">
Select Course
</option>

<option>
7 Days Bike Training
</option>

<option>
14 Days Bike Training
</option>

<option>
Ladies Special Training
</option>

</select>


<input 
type="text"
id="inputDuration"
placeholder="Training Duration">


<button onclick="generateCertificate()">

Generate Certificate

</button>


</div>


</section>



<script src="script.js"></script>


</body>

</html>
