<!DOCTYPE html>
<html>

<head>

<title>Admin Certificate Generator - Anjali Bike Driving School</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>

  
</head>


<body>

  <header class="admin-header">

<div class="admin-logo">

🏍️

<div>
<h2>
Anjali Bike Driving School
</h2>

<p>
Admin Certificate Panel
</p>

</div>

</div>


<a href="#" onclick="logoutAdmin()" class="logout-btn">
Logout
</a>


</header>

<section class="admin-panel">


<div class="admin-box">


<h1>
🏆 Admin Certificate Generator
</h1>


<p>
Generate student training certificates
</p>


<input 
type="text"
id="inputName"
placeholder="Student Name">


<select id="inputCourse">

<option value="">
Select Course
</option>

<option>
7 Days Bike Training
</option>

<option>
14 Days Bike Training
</option>

<option>
Ladies Special Training
</option>

</select>


<input 
type="text"
id="inputDuration"
placeholder="Training Duration">


<button onclick="generateCertificate()">

Generate Certificate

</button>

<span id="previewDate"></span>
</p>


<br>


<h3>
Authorized Signature
</h3>

  <hr>

<h2>
📋 Generated Certificates
</h2>


<input 
type="text"
id="searchCertificate"
placeholder="Search Certificate ID / Student Name"
onkeyup="loadCertificates()">


<div id="certificateList">

Loading certificates...

</div>

</div>

<button onclick="downloadPDF()" class="download-btn">
📄 Download Certificate PDF
</button>


</div>
  
</div>


</section>

<script>

if(localStorage.getItem("adminLogin") !== "true"){

window.location.href="admin-login.html";

}

</script>

  
<script src="./script.js"></script>

<script>

window.onload=function(){

loadCertificates();

}

</script>
  
<script>

function logoutAdmin(){

localStorage.removeItem("adminLogin");

window.location.href="admin-login.html";

}

</script>

<script>

function downloadPDF(){

window.print();

}

</script>

<script>
window.onload = searchCertificates;
</script>
  
</body>

</html>
