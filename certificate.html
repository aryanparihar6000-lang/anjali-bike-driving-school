<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anjali Bike Driving School Certificate</title>

<link rel="stylesheet" href="certificate.css">

</head>


<body>

<div class="generator-form">

<h2>
Generate Training Certificate
</h2>


<input 
type="text" 
id="inputName"
placeholder="Enter Student Name">


<select id="inputCourse">

<option>
7 Days Bike Training
</option>

<option>
14 Days Bike Training
</option>

<option>
Advanced Bike Riding Course
</option>

</select>


<button onclick="generateCertificate()">

Generate Certificate

</button>


</div>
  
<div class="certificate-page">


<div class="certificate">


<div class="logo">
🏍️
</div>


<h2>
ANJALI BIKE DRIVING SCHOOL
</h2>


<h1>
CERTIFICATE
</h1>

<h3>
OF COMPLETION
</h3>


<p>
This certificate is proudly presented to
</p>


<h4 id="studentName">
Student Name
</h4>


<p>
For successfully completing
</p>


<h3 id="courseName">
Bike Riding Training
</h3>


<div class="details">

<p>
Certificate ID:
<span id="certificateId"></span>
</p>


<p>
Date:
<span id="date"></span>
</p>

</div>



<div class="signature">

<div>
_________________
<br>
Instructor
</div>


<div>
_________________
<br>
Director
</div>

</div>



</div>


</div>


<script src="certificate.js"></script>


</body>

</html>
