<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Certificate Verification - Anjali Bike Driving School
</title>


<link rel="stylesheet" href="style.css">

<style>

body{

background:#f5f7fb;

}


.verify-card{

max-width:600px;

margin:30px auto;

background:white;

padding:40px 30px;

border-radius:25px;

border:3px solid #d4af37;

box-shadow:0 15px 40px rgba(0,0,0,.15);

text-align:center;

}



.verify-card input{

width:90%;

padding:15px;

border-radius:10px;

border:1px solid #ccc;

font-size:16px;

margin-bottom:20px;

}



.verify-card h3{

color:#d62828;

font-size:26px;

}



#verifyBox{

margin-top:30px;

background:#fff8e7;

padding:25px;

border-radius:15px;

border-left:5px solid #d4af37;

}



#verifyBox p{

font-size:17px;

margin:12px;

color:#333;

}



#status{

font-weight:bold;

color:#16a34a;

font-size:20px;

}



.verified-badge{

display:inline-block;

background:#16a34a;

color:white;

padding:8px 20px;

}

</style>
  
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>

</head>


<body>


<section class="certificate-verify-page">


<div class="container">


<div class="section-title">

<span>VERIFY</span>

<h2>
Certificate Verification
</h2>

<p>
Verify the authenticity of Anjali Bike Driving School certificate.
</p>

</div>

<img 
src="https://raw.githubusercontent.com/aryanparihar6000-lang/anjali-bike-driving-school/main/logo.jpeg"
alt="Anjali Bike Driving School Logo"
style="
width:120px;
height:120px;
object-fit:contain;
margin-bottom:20px;
">

<div class="verify-card">



<input 
type="text"
id="certificateSearch"
placeholder="Enter Certificate ID">



<button 
class="btn"
onclick="checkCertificate()">

Verify Certificate

</button>



<div id="verifyBox">


<h3>
Certificate Details
</h3>


<p>
Certificate ID:
<span id="verifyID">
-
</span>
</p>


<p>
Status:
<span id="status">
-
</span>
</p>


<p>
Student:
<span id="verifyName">
-
</span>
</p>


<p>
Course:
<span id="verifyCourse">
-
</span>
</p>


</div>



</div>


</div>


</section>




<script>

async function checkCertificate(){

let id = document.getElementById("certificateSearch").value.trim();


if(id==""){

alert("Please enter Certificate ID");

return;

}


const docRef = db.collection("certificates").doc(id);


const doc = await docRef.get();


if(doc.exists){


const data = doc.data();


document.getElementById("verifyID").innerHTML =
data.id;


document.getElementById("status").innerHTML =
'<span class="verified-badge">✅ Certificate Verified</span>';

document.getElementById("verifyName").innerHTML =
data.name;


document.getElementById("verifyCourse").innerHTML =
data.course;


}
else{


document.getElementById("verifyID").innerHTML =
id;


document.getElementById("status").innerHTML =
"Certificate Not Found ❌";


document.getElementById("verifyName").innerHTML =
"-";


document.getElementById("verifyCourse").innerHTML =
"-";


}

}


// QR Auto Fill

window.onload = function(){


const urlParams = new URLSearchParams(window.location.search);

const certificateID = urlParams.get("id");


if(certificateID){

document.getElementById("certificateSearch").value = certificateID;

checkCertificate();

}


}

</script>

<script>
console.log("Verification JS Loaded");
</script>
  
</body>

</html>
